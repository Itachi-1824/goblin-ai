[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goblin-ai"
version = "2.2.0"
description = "AI image generation with protected native modules and local upscaling"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "MODEL_LICENSES.md"]
requires-python = ">=3.11,<3.15"
authors = [{name = "Goblin Team"}]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "curl_cffi>=0.16.3,<0.17",
  "fastapi>=0.115,<1",
  "uvicorn>=0.23,<1",
  "pydantic>=2,<3",
  "camoufox[geoip]>=0.5.8,<0.6",
  "playwright>=1.42",
  "opencv-python>=4.8,<6",
  "Pillow>=11,<13",
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.20,<2"]
gpu = [
  "onnxruntime-gpu[cuda,cudnn]>=1.31,<1.32; sys_platform != 'darwin'",
  "onnxruntime>=1.20,<2; sys_platform == 'darwin'",
]
amd = [
  "onnxruntime-directml>=1.24.4,<1.25; sys_platform == 'win32'",
  "onnxruntime>=1.23,<2; sys_platform == 'linux'",
]
apple = ["onnxruntime>=1.20,<2; sys_platform == 'darwin'"]
quality = ["onnxruntime>=1.20,<2"]
best = ["onnxruntime>=1.20,<2"]
all = ["onnxruntime>=1.20,<2"]

[project.scripts]
goblin = "goblin.__main__:main"

[project.urls]
Homepage = "https://github.com/Itachi-1824/goblin-ai"
Documentation = "https://github.com/Itachi-1824/goblin-ai/blob/main/docs/index.md"
Issues = "https://github.com/Itachi-1824/goblin-ai/issues"

[tool.setuptools]
packages = ["goblin"]
include-package-data = false

[tool.setuptools.package-data]
goblin = ["static/index.html", "static/app.css", "static/app.js", "static/shimmer.gif"]
